<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="Muexe - Free Online Tools">
      <span class="brand-logo" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="34" height="34" rx="8" fill="#2563eb"/>
          <path d="M9 11h6.2c2.9 0 5 1.5 5 4.1 0 1.9-1.1 3.2-2.8 3.8L20.5 23h-3.4l-2.6-3.9H11.7V23H9V11zm2.7 2.2v3.3h3.1c1.4 0 2.3-.6 2.3-1.7 0-1.1-.9-1.6-2.2-1.6h-3.2z" fill="#fff"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Muexe</span>
        <span class="brand-tagline">Free Online Tools</span>
      </span>
    </a>

    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="site-search" placeholder="Search tools…" autocomplete="off" aria-label="Search tools" />
      <div class="search-results" id="search-results" role="listbox"></div>
    </div>

    <nav class="main-nav" id="main-nav" aria-label="Main navigation">
      {{NAV_MENU}}
    </nav>

    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
