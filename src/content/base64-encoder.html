<div class="tool-widget">
  <div class="form-row">
    <label for="b64-input">Input text</label>
    <textarea id="b64-input" placeholder="Type or paste text to encode…"></textarea>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    <button class="btn btn-primary" id="b64-encode" type="button">Encode</button>
    <button class="btn btn-primary" id="b64-decode" type="button">Decode</button>
  </div>
  <div class="form-row">
    <label for="b64-output">Result</label>
    <textarea id="b64-output" readonly placeholder="Result appears here…" aria-live="polite"></textarea>
  </div>
  <button class="btn btn-secondary" id="b64-copy" type="button">Copy result</button>
</div>
