<div class="tool-widget">
  <div class="form-row">
    <label for="wc-input">Type or paste your text</label>
    <textarea id="wc-input" placeholder="Start typing…"></textarea>
  </div>
  <div class="result-box" id="wc-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;text-align:center">
    <div><p class="note">Words</p><strong id="wc-words" style="font-size:1.4rem">0</strong></div>
    <div><p class="note">Characters</p><strong id="wc-chars" style="font-size:1.4rem">0</strong></div>
    <div><p class="note">No spaces</p><strong id="wc-charsns" style="font-size:1.4rem">0</strong></div>
    <div><p class="note">Sentences</p><strong id="wc-sent" style="font-size:1.4rem">0</strong></div>
    <div><p class="note">Paragraphs</p><strong id="wc-para" style="font-size:1.4rem">0</strong></div>
    <div><p class="note">Reading time</p><strong id="wc-read" style="font-size:1.4rem">0s</strong></div>
    <div><p class="note">Speaking time</p><strong id="wc-speak" style="font-size:1.4rem">0s</strong></div>
  </div>
</div>
