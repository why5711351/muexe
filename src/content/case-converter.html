<div class="tool-widget">
  <div class="form-row">
    <label for="cc-input">Type or paste your text</label>
    <textarea id="cc-input" placeholder="Your text here…"></textarea>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-secondary cc-btn" data-case="upper" type="button">UPPERCASE</button>
    <button class="btn btn-secondary cc-btn" data-case="lower" type="button">lowercase</button>
    <button class="btn btn-secondary cc-btn" data-case="title" type="button">Title Case</button>
    <button class="btn btn-secondary cc-btn" data-case="sentence" type="button">Sentence case</button>
    <button class="btn btn-secondary cc-btn" data-case="camel" type="button">camelCase</button>
    <button class="btn btn-secondary cc-btn" data-case="pascal" type="button">PascalCase</button>
    <button class="btn btn-secondary cc-btn" data-case="snake" type="button">snake_case</button>
    <button class="btn btn-secondary cc-btn" data-case="kebab" type="button">kebab-case</button>
    <button class="btn btn-secondary cc-btn" data-case="copy" type="button">Copy result</button>
  </div>
  <div class="form-row" style="margin-top:14px">
    <label for="cc-output">Result</label>
    <textarea id="cc-output" readonly></textarea>
  </div>
</div>
