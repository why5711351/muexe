<div class="tool-widget">
  <div class="form-row">
    <label for="loan-amount">Loan amount ($)</label>
    <input type="number" id="loan-amount" min="0" step="100" placeholder="10000">
  </div>
  <div class="form-row">
    <label for="loan-rate">Annual interest rate (%)</label>
    <input type="number" id="loan-rate" min="0" step="0.01" placeholder="5.0">
  </div>
  <div class="form-row">
    <label for="loan-term">Loan term (years)</label>
    <input type="number" id="loan-term" min="1" max="50" step="1" placeholder="5">
  </div>
  <div class="result-box" id="loan-result" aria-live="polite">
    <p>Enter your loan details to see your monthly payment.</p>
  </div>
</div>
