<div class="tool-widget">
  <div class="form-row">
    <label for="jtp-input">Choose a JPG image</label>
    <input type="file" id="jtp-input" accept=".jpg,.jpeg,image/jpeg">
  </div>
  <div class="form-row" id="jtp-preview-row" style="display:none">
    <label>Preview</label>
    <img id="jtp-preview" alt="Preview" style="max-width:100%;border-radius:10px;border:1px solid #e5e7eb">
  </div>
  <button class="btn" id="jtp-download" type="button" style="display:none">Download PNG</button>
  <p class="note" id="jtp-status"></p>
</div>
