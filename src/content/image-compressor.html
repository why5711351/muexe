<div class="tool-widget">
  <div class="form-row">
    <label for="ic-input">Choose an image</label>
    <input type="file" id="ic-input" accept="image/*">
  </div>
  <div class="form-row">
    <label for="ic-quality">Quality: <span id="ic-qval">0.75</span></label>
    <input type="range" id="ic-quality" min="0.1" max="1" step="0.05" value="0.75" style="width:100%">
  </div>
  <div class="form-row">
    <label for="ic-format">Output format</label>
    <select id="ic-format">
      <option value="image/jpeg">JPEG</option>
      <option value="image/webp">WebP</option>
    </select>
  </div>
  <div class="result-box" id="ic-result" style="display:none">
    <p><strong id="ic-size-orig"></strong></p>
    <p><strong id="ic-size-new"></strong></p>
    <img id="ic-preview" alt="Compressed preview" style="max-width:100%;border-radius:8px;margin-top:10px">
  </div>
  <button class="btn" id="ic-download" type="button" style="display:none">Download compressed image</button>
  <p class="note" id="ic-status"></p>
</div>
