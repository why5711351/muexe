<div class="tool-widget">
  <div class="form-row">
    <label for="tip-bill">Bill amount ($)</label>
    <input type="number" id="tip-bill" min="0" step="0.01" placeholder="0.00">
  </div>
  <div class="form-row">
    <label>Tip percentage</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary tip-pct" data-pct="10" type="button">10%</button>
      <button class="btn btn-secondary tip-pct" data-pct="15" type="button">15%</button>
      <button class="btn btn-secondary tip-pct" data-pct="18" type="button">18%</button>
      <button class="btn btn-secondary tip-pct" data-pct="20" type="button">20%</button>
    </div>
  </div>
  <div class="form-row">
    <label for="tip-pct">Custom tip %</label>
    <input type="number" id="tip-pct" min="0" step="0.1" value="15">
  </div>
  <div class="form-row">
    <label for="tip-people">Number of people</label>
    <input type="number" id="tip-people" min="1" step="1" value="1">
  </div>
  <div class="result-box" id="tip-result" aria-live="polite">
    <p>Enter your bill to see the tip and split.</p>
  </div>
</div>
