<div class="tool-widget">
  <div class="form-row">
    <label for="pw-length">Password length: <span id="pw-len-label">16</span></label>
    <input type="range" id="pw-length" min="4" max="64" value="16">
  </div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px">
    <label><input type="checkbox" id="pw-upper" checked> Uppercase</label>
    <label><input type="checkbox" id="pw-lower" checked> Lowercase</label>
    <label><input type="checkbox" id="pw-num" checked> Numbers</label>
    <label><input type="checkbox" id="pw-sym" checked> Symbols</label>
  </div>
  <button class="btn btn-primary" id="pw-gen" type="button">Generate Password</button>
  <div class="form-row" style="margin-top:14px">
    <label for="pw-output">Generated password</label>
    <input type="text" id="pw-output" readonly placeholder="Click generate…" aria-live="polite">
  </div>
  <button class="btn btn-secondary" id="pw-copy" type="button">Copy password</button>
</div>
