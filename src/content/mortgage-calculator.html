<div class="tool-widget">
  <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div><label for="mc-amount">Loan amount ($)</label><input type="number" id="mc-amount" placeholder="300000" min="1"></div>
    <div><label for="mc-rate">Interest rate (% / year)</label><input type="number" id="mc-rate" placeholder="6.5" step="0.01" min="0"></div>
  </div>
  <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div><label for="mc-term">Loan term (years)</label><input type="number" id="mc-term" placeholder="30" min="1" max="50"></div>
    <div><label for="mc-extra">Extra monthly payment ($)</label><input type="number" id="mc-extra" placeholder="0" min="0"></div>
  </div>
  <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div><label for="mc-tax">Property tax ($ / year)</label><input type="number" id="mc-tax" placeholder="0" min="0"></div>
    <div><label for="mc-ins">Insurance ($ / year)</label><input type="number" id="mc-ins" placeholder="0" min="0"></div>
  </div>
  <button class="btn" id="mc-calc" type="button">Calculate</button>
  <div class="result-box" id="mc-result" style="display:none"></div>
</div>
