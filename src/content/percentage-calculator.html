<div class="tool-widget">
  <div style="display:grid;gap:28px">

    <div>
      <h3 style="margin-bottom:10px">What is X% of Y?</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label for="pct-x1">Percent (%)</label><input type="number" id="pct-x1" placeholder="20"></div>
        <div><label for="pct-y1">Number</label><input type="number" id="pct-y1" placeholder="150"></div>
      </div>
      <button class="btn" id="pct-run1" type="button" style="margin-top:12px">Calculate</button>
      <div class="result-box" id="pct-r1" style="display:none"></div>
    </div>

    <div>
      <h3 style="margin-bottom:10px">X is what percent of Y?</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label for="pct-x2">Part (X)</label><input type="number" id="pct-x2" placeholder="30"></div>
        <div><label for="pct-y2">Whole (Y)</label><input type="number" id="pct-y2" placeholder="150"></div>
      </div>
      <button class="btn" id="pct-run2" type="button" style="margin-top:12px">Calculate</button>
      <div class="result-box" id="pct-r2" style="display:none"></div>
    </div>

    <div>
      <h3 style="margin-bottom:10px">Percentage change from A to B</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label for="pct-x3">Original (A)</label><input type="number" id="pct-x3" placeholder="100"></div>
        <div><label for="pct-y3">New (B)</label><input type="number" id="pct-y3" placeholder="125"></div>
      </div>
      <button class="btn" id="pct-run3" type="button" style="margin-top:12px">Calculate</button>
      <div class="result-box" id="pct-r3" style="display:none"></div>
    </div>

  </div>
</div>
